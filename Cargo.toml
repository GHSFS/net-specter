[package]
name = "net-specter"
version = "0.8.0"
edition = "2021"
rust-version = "1.75"
description = "Zero-dependency network packet forensics, PCAP/PCAPNG analyzer, TLS JA3/JA4 fingerprinting engine, and covert channel detector in pure Rust."
authors = ["GHSFS"]
license = "Apache-2.0"
repository = "https://github.com/GHSFS/net-specter"
readme = "README.md"
keywords = ["pcap", "ja3", "tls", "dns", "forensics"]
categories = ["network-programming", "command-line-utilities", "parser-implementations"]

[lib]
name = "net_specter"
path = "src/lib.rs"

[[bin]]
name = "nspecter"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zeroize = "1.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
